<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ledger – Personal Finance</title>
<style>
:root{--bg:#F7F5F0;--pr:#292B2A;--sec:#85847E;--ac:#819681;--card:#fff;--bd:#E6E1D8;--inc:#648568;--exp:#C77D68;--sh:0 1px 3px rgba(41,43,42,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#1b1c1b;--pr:#efece6;--sec:#a3a29b;--card:#262827;--bd:#3b3d3b;--sh:none}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--pr);font:15px/1.45 "Inter","Segoe UI",system-ui,sans-serif}

main{flex:1;padding:28px;max-width:1100px;min-width:0}h2{font:600 26px Georgia,serif;margin:0 0 18px}h3{margin:22px 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
small,.mut{color:var(--sec);font-size:13px;display:block}.big{font-size:22px;display:block;margin:2px 0}.hero{font:600 44px Georgia,serif;display:block;margin:4px 0}
.inc{color:var(--inc)}.exp{color:var(--exp)}.safe{background:var(--pr);color:var(--bg);border:0}.safe small{color:var(--bg);opacity:.75}
.pb{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;border-radius:6px}
.row2{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row2>div{flex:1;min-width:0}.row2:last-child{border:0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--pr);padding:8px 14px;border-radius:10px;cursor:pointer}.p{background:var(--pr);color:var(--bg);border-color:var(--pr)}.ic{padding:4px 9px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--pr);width:100%}.bar input,.bar select{width:auto;flex:1;min-width:120px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--sec)}label input,label select{margin-top:4px;color:var(--pr)}
#m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;align-items:center;justify-content:center;padding:16px}#m.open{display:flex}.mb{background:var(--bg);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.mb .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}#err{color:var(--exp);margin-bottom:8px}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd)}.Overdue{color:var(--exp);border-color:var(--exp)}.Paid{color:var(--inc);border-color:var(--inc)}.warn{color:#a8801f}
.ch{width:100%;height:auto}textarea{height:200px}#fab{position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;font-size:26px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media(max-width:760px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);z-index:10;border:0;border-top:1px solid var(--bd)}nav h1{display:none}nav a{flex:1;flex-direction:column;align-items:center;gap:0;font-size:10px;padding:6px 0;margin:0}nav a span{font-size:17px}main{padding:18px 14px 100px}#fab{bottom:80px}.hero{font-size:38px}}
</style></head><body><div id=app><nav id=nv></nav><main id=mn></main></div><div id=m></div><button id=fab class="btn p" aria-label="Quick add" onclick="quick()">+</button>
<script>
const $=s=>document.querySelector(s),K='ledger_v1',pad=n=>String(n).padStart(2,'0'),uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),T=iso(new Date()),CM=T.slice(0,7);
const dim=y=>new Date(+y.slice(0,4),+y.slice(5),0).getDate(),addM=(y,n)=>iso(new Date(+y.slice(0,4),+y.slice(5)-1+n,1)).slice(0,7);
const MN=y=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+y.slice(5)-1],dd=d=>Math.round((new Date(d)-new Date(T))/864e5);
const P=v=>{const n=Number(v);return v===''||!isFinite(n)||n<0?null:Math.round(n*100)},F=p=>(p<0?'-':'')+'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const okD=s=>/^\d{4}-\d\d-\d\d$/.test(s)&&!isNaN(Date.parse(s)),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((n,x)=>n+x.amt,0),pct=(a,b)=>b>0?a/b*100:0;
const def=()=>({set:{salary:0,day:1,desc:'Monthly salary',budget:0,fb:0,vb:0,target:0,daily:0,auto:true,done:false},tx:[],bills:[],sav:[],closed:{},audit:[],goals:[],lim:{}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||def();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const IC=['Salary','Freelance','Bonus','Refund','Gift','Other'],EC=['Food','Groceries','Transport','Shopping','Health','Entertainment','Education','Travel','Other'],BC=['PG rent','Transportation','Utilities','Mobile & internet','Subscriptions','Insurance','Loan / EMI','Other recurring'];
let V='dash',Fq={q:'',type:'',cat:'',from:'',to:''},RM=CM;
const M=y=>{const t=S.tx.filter(x=>x.date.startsWith(y)),inc=t.filter(x=>x.type=='income'),ex=t.filter(x=>x.type=='expense');return{t,ex,inc:sum(inc),sal:sum(inc.filter(x=>x.cat=='Salary')),exp:sum(ex),fx:sum(ex.filter(x=>x.key)),vx:sum(ex.filter(x=>!x.key))}};
const occ=(b,y)=>{const f=b.due,fy=f.slice(0,7);if(y<fy)return[];if(b.freq=='Weekly'){const r=[];let d=new Date(f+'T00:00');while(iso(d).slice(0,7)<=y){if(iso(d).slice(0,7)==y)r.push(iso(d));d.setDate(d.getDate()+7)}return r}
const df=(+y.slice(0,4)-+fy.slice(0,4))*12+(+y.slice(5)-+fy.slice(5)),st=b.freq=='Quarterly'?3:b.freq=='Yearly'?12:1;if(df%st)return[];return[y+'-'+pad(Math.min(+f.slice(8),dim(y)))]};
const BM=y=>S.bills.filter(b=>!b.paused).flatMap(b=>occ(b,y).map(d=>{const key=b.id+'@'+d,paid=S.tx.some(x=>x.key==key);return{b,d,key,paid,st:paid?'Paid':d<T?'Overdue':(dd(d)<=(+b.rem||3))?'Due':'Upcoming'}})).sort((a,b)=>a.d.localeCompare(b.d));
const SB=()=>{const g=t=>sum(S.sav.filter(x=>x.type==t)),s=g('initial'),c=g('deposit')+g('month'),w=g('withdraw'),a=g('adjust');return{s,c,w,a,bal:s+c+a-w}};
const D=()=>{const m=M(CM),bl=BM(CM),fixed=bl.reduce((n,x)=>n+x.b.amt,0),res=bl.filter(x=>!x.paid).reduce((n,x)=>n+x.b.amt,0),avail=S.set.budget-fixed-m.vx,left=dim(CM)-+T.slice(8)+1,safe=Math.floor(Math.max(0,avail)/left),td=sum(m.ex.filter(x=>!x.key&&x.date==T));
const allI=sum(S.tx.filter(x=>x.type=='income')),allE=sum(S.tx.filter(x=>x.type=='expense')),out=sum(S.sav.filter(x=>x.type=='month'||x.type=='deposit')),wd=sum(S.sav.filter(x=>x.type=='withdraw'));
return{m,bl,fixed,res,avail,left,safe,td,bal:allI-allE-out+wd}};
const pb=p=>`<div class=pb><i style="width:${Math.min(100,p)}%;background:${p>=100?'var(--exp)':p>=80?'#C9A15A':'var(--ac)'}"></i></div>`;
const card=(l,v,s='',c='')=>`<div class=card><small>${l}</small><b class="big ${c}">${v}</b>${s?`<small>${s}</small>`:''}</div>`;
function modal(title,fields,cb,extra='',ok='Save'){const d=$('#m');d.innerHTML=`<div class=mb role=dialog><h3 style="margin-top:0">${title}</h3><div id=err></div>${extra}${fields.map(f=>`<label>${f.l}${f.o?`<select name=${f.k}>${f.o.map(o=>`<option ${o==f.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input name=${f.k} type=${f.t||'text'} value="${E(f.v??'')}" ${f.t=='number'?'step=0.01 min=0':''}>`}</label>`).join('')}<div class=row><button onclick=cm()>Cancel</button>${ok?'<button class="btn p" id=ok>'+ok+'</button>':''}</div></div>`;d.className='open';
if(ok)$('#ok').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=d.querySelector(`[name=${f.k}]`).value.trim());const e=cb&&cb(v);if(e)$('#err').textContent=e;else{cm();render()}}}
const cm=()=>{$('#m').className=''},info=t=>modal('Notice',[],null,`<p>${t}</p>`,''),ask=(t,fn)=>modal('Please confirm',[],()=>{fn()},`<p>${t}</p>`,'Confirm');
const locked=d=>S.closed[d.slice(0,7)]?'That month is closed. Use Savings → Manual correction for adjustments.':'';
const txCb=(type,id)=>v=>{const a=P(v.amt);if(!v.name)return'Enter a name.';if(!a)return'Enter a valid amount.';if(!okD(v.date))return'Enter a valid date.';const l=locked(v.date);if(l)return l;
const o={type,name:v.name,amt:a,date:v.date,cat:v.cat,method:v.method||'',notes:v.notes||''};if(id)Object.assign(S.tx.find(x=>x.id==id),o);else S.tx.push({id:uid(),...o});save()};
function incForm(id){const x=S.tx.find(t=>t.id==id)||{};modal(id?'Edit income':'Add income',[{k:'name',l:'Source',v:x.name},{k:'amt',l:'Amount (₹)',t:'number',v:x.amt/100||''},{k:'date',l:'Date received',t:'date',v:x.date||T},{k:'cat',l:'Category',o:IC,v:x.cat}],txCb('income',id))}
function expForm(id){const x=S.tx.find(t=>t.id==id)||{};modal(id?'Edit purchase':'Record purchase',[{k:'name',l:'Description',v:x.name},{k:'amt',l:'Amount (₹)',t:'number',v:x.amt/100||''},{k:'date',l:'Date',t:'date',v:x.date||T},{k:'cat',l:'Category',o:EC,v:x.cat},{k:'method',l:'Payment method (optional)',v:x.method},{k:'notes',l:'Notes (optional)',v:x.notes}],txCb('expense',id))}
function quick(){modal('Quick add',[],null,`<div class=bar><button class="btn p" onclick="cm();expForm()">Record purchase</button><button class=btn onclick="cm();incForm()">Add income</button><button class=btn onclick="cm();V='fx';render()">Pay a bill</button></div>`,'')}
function editTx(id){const x=S.tx.find(t=>t.id==id),l=locked(x.date);if(l)return info(l);if(x.key)return info('Bill payments can be deleted and paid again.');(x.type=='income'?incForm:expForm)(id)}
function delTx(id){const x=S.tx.find(t=>t.id==id),l=locked(x.date);if(l)return info(l);ask('Delete “'+E(x.name)+'”?'+(x.key?' The bill will show as unpaid again.':''),()=>{S.tx=S.tx.filter(t=>t.id!=id);save()})}
function pay(key){const o=BM(CM).find(x=>x.key==key);if(!o||o.paid)return info('This bill is already paid.');ask('Mark “'+E(o.b.name)+'” ('+F(o.b.amt)+') as paid today?',()=>{if(S.tx.some(x=>x.key==key))return;S.tx.push({id:uid(),type:'expense',name:o.b.name,amt:o.b.amt,date:T,cat:o.b.cat,method:o.b.method||'',notes:'Fixed bill due '+o.d,key});save()})}
function billForm(id){const b=S.bills.find(x=>x.id==id)||{};modal(id?'Edit fixed expense':'Add fixed expense',[{k:'name',l:'Name',v:b.name},{k:'amt',l:'Amount (₹)',t:'number',v:b.amt/100||''},{k:'cat',l:'Category',o:BC,v:b.cat},{k:'due',l:'First / next due date',t:'date',v:b.due||T},{k:'freq',l:'Frequency',o:['Weekly','Monthly','Quarterly','Yearly'],v:b.freq||'Monthly'},{k:'rem',l:'Remind (days before)',o:['1','3','7'],v:b.rem||'3'},{k:'method',l:'Payment account (optional)',v:b.method}],v=>{const a=P(v.amt);if(!v.name)return'Enter a name.';if(!a)return'Enter a valid amount.';if(!okD(v.due))return'Enter a valid date.';const o={name:v.name,amt:a,cat:v.cat,due:v.due,freq:v.freq,rem:v.rem,method:v.method};if(id)Object.assign(S.bills.find(x=>x.id==id),o);else S.bills.push({id:uid(),paused:false,...o});save()})}
const togB=id=>{const b=S.bills.find(x=>x.id==id);b.paused=!b.paused;save();render()},delB=id=>ask('Delete this recurring expense? Past payments stay in history.',()=>{S.bills=S.bills.filter(x=>x.id!=id);save()});
function salForm(){const s=S.set;modal('Salary & budget',[{k:'salary',l:'Monthly salary (₹)',t:'number',v:s.salary/100},{k:'day',l:'Expected pay day (1–31)',t:'number',v:s.day},{k:'desc',l:'Description',v:s.desc},{k:'budget',l:'Monthly spending budget (₹)',t:'number',v:s.budget/100},{k:'target',l:'Monthly savings target (₹)',t:'number',v:s.target/100},{k:'daily',l:'Preferred daily target (₹, 0 = use safe limit)',t:'number',v:s.daily/100}],v=>{const a=P(v.salary),b=P(v.budget),t=P(v.target),d=P(v.daily),dy=+v.day;if([a,b,t,d].includes(null))return'Enter valid amounts.';if(!(dy>=1&&dy<=31))return'Pay day must be 1–31.';Object.assign(S.set,{salary:a,budget:b,target:t,daily:d,day:dy,desc:v.desc});save()})}
function setup(){modal('Welcome – quick setup',[{k:'salary',l:'Monthly salary (₹)',t:'number'},{k:'day',l:'Pay day of month',t:'number',v:1},{k:'budget',l:'Monthly spending budget (₹)',t:'number'},{k:'target',l:'Monthly savings target (₹)',t:'number'},{k:'init',l:'Existing savings (₹)',t:'number',v:0}],v=>{const a=P(v.salary),b=P(v.budget),t=P(v.target),i=P(v.init),dy=+v.day;if([a,b,t,i].includes(null))return'Enter valid amounts.';if(!(dy>=1&&dy<=31))return'Pay day must be 1–31.';Object.assign(S.set,{salary:a,budget:b,target:t,day:dy,done:true,fb:Math.round(b*.5),vb:b-Math.round(b*.5)});if(i>0)S.sav.push({id:uid(),type:'initial',amt:i,date:T,note:'Initial savings'});save()},'<p class=mut>Add fixed bills afterwards in Fixed Expenses.</p>')}
function confSal(){const s=S.set;if(!s.salary)return info('Set your salary first.');if(S.tx.some(x=>x.sal==CM))return info('This month’s salary is already recorded.');ask('Record '+F(s.salary)+' salary received?',()=>{S.tx.push({id:uid(),type:'income',name:s.desc||'Salary',amt:s.salary,date:CM+'-'+pad(Math.min(s.day,dim(CM),+T.slice(8))),cat:'Salary',sal:CM});save()})}
function closeM(y){const m=M(y),c=Math.max(0,m.inc-m.exp);modal('Close '+MN(y)+' '+y.slice(0,4),[],()=>{if(S.closed[y])return'Already closed.';doClose(y);save()},`<p>Income ${F(m.inc)}<br>Expenses paid ${F(m.exp)}<br><b>Savings contribution ${F(c)}</b>${m.inc<m.exp?'<br>Deficit: nothing recorded, savings unchanged.':''}</p>`,'Confirm & close')}
function doClose(y){if(S.closed[y])return;const m=M(y),c=Math.max(0,m.inc-m.exp);if(c>0)S.sav.push({id:uid(),type:'month',amt:c,date:y+'-'+dim(y),note:'Month-end '+y,month:y});S.closed[y]={inc:m.inc,exp:m.exp,c};S.audit.push({d:T,t:'Closed '+y+' · saved '+F(c)})}
const autoClose=()=>{if(S.set.auto){[...new Set(S.tx.map(x=>x.date.slice(0,7)))].filter(y=>y<CM&&!S.closed[y]).forEach(doClose);save()}};
function savForm(type){const l={initial:'Set initial savings',deposit:'Add deposit',withdraw:'Withdraw'}[type];modal(l,[{k:'amt',l:'Amount (₹)',t:'number'},{k:'date',l:'Date',t:'date',v:T},{k:'note',l:'Account / location (optional)'}],v=>{const a=P(v.amt);if(!a)return'Enter a valid amount.';if(!okD(v.date))return'Enter a valid date.';if(type=='withdraw'&&a>SB().bal)return'Withdrawal exceeds savings balance.';if(type=='initial')S.sav=S.sav.filter(x=>x.type!='initial');S.sav.push({id:uid(),type,amt:a,date:v.date,note:v.note});save()})}
function adjForm(){modal('Manual correction',[{k:'amt',l:'Change in savings (₹, negative to reduce)',t:'number'},{k:'why',l:'Reason (required)'}],v=>{const n=Math.round(Number(v.amt)*100);if(!v.amt||!isFinite(n)||!n)return'Enter a non-zero amount.';if(!v.why)return'A reason is required.';if(SB().bal+n<0)return'Would make savings negative.';S.sav.push({id:uid(),type:'adjust',amt:n,date:T,note:v.why});S.audit.push({d:T,t:'Correction '+F(n)+': '+v.why});save()})}
function goalForm(){modal('New savings goal',[{k:'name',l:'Goal name'},{k:'target',l:'Target amount (₹)',t:'number'},{k:'date',l:'Target date',t:'date',v:T}],v=>{const a=P(v.target);if(!v.name||!a)return'Enter a name and valid target.';if(!okD(v.date))return'Enter a valid date.';S.goals.push({id:uid(),name:v.name,target:a,alloc:0,date:v.date});save()})}
function allocForm(id){const g=S.goals.find(x=>x.id==id);modal('Allocate to '+E(g.name),[{k:'amt',l:'Total allocated (₹)',t:'number',v:g.alloc/100}],v=>{const a=P(v.amt),o=sum(S.goals.map(x=>({amt:x.id==id?0:x.alloc})));if(a==null)return'Enter a valid amount.';if(a+o>SB().bal)return'Allocations can’t exceed your savings balance ('+F(SB().bal)+').';g.alloc=a;save()},'<p class=mut>Allocations are a view of existing savings, not extra money.</p>')}
function limForm(){modal('Category limit',[{k:'cat',l:'Category',o:[...EC,...BC]},{k:'amt',l:'Monthly limit (₹, 0 removes)',t:'number'}],v=>{const a=P(v.amt);if(a==null)return'Enter a valid amount.';if(a)S.lim[v.cat]=a;else delete S.lim[v.cat];save()})}
function budForm(){const s=S.set;modal('Monthly budgets',[{k:'b',l:'Total monthly budget (₹)',t:'number',v:s.budget/100},{k:'f',l:'Fixed-expense budget (₹)',t:'number',v:s.fb/100},{k:'v',l:'Variable-expense budget (₹)',t:'number',v:s.vb/100}],v=>{const b=P(v.b),f=P(v.f),x=P(v.v);if([b,f,x].includes(null))return'Enter valid amounts.';Object.assign(s,{budget:b,fb:f,vb:x});save()})}
const csv=r=>r.map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),showCsv=r=>modal('CSV export',[],()=>{try{navigator.clipboard.writeText($('#ct').value)}catch(e){}},`<textarea id=ct readonly>${E(csv(r))}</textarea><p class=mut>Copy and paste into a spreadsheet.</p>`,'Copy');
const bars=rows=>{const mx=Math.max(1,...rows.flatMap(r=>[r[1],r[2]]));return`<svg viewBox="0 0 300 125" class=ch role=img aria-label="Income versus expenses">${rows.map((r,i)=>{const x=i*50+6,a=r[1]/mx*90,b=r[2]/mx*90;return`<rect x=${x} y=${100-a} width=16 height=${a} rx=3 fill="var(--inc)"/><rect x=${x+18} y=${100-b} width=16 height=${b} rx=3 fill="var(--exp)"/><text x=${x+17} y=116 text-anchor=middle font-size=9 fill="var(--sec)">${r[0]}</text>`}).join('')}</svg><small><span class=inc>■</span> Income <span class=exp>■</span> Expenses</small>`};
const catRows=ex=>{const c={};ex.forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);return Object.entries(c).sort((a,b)=>b[1]-a[1])},catBars=ex=>{const r=catRows(ex),t=sum(r.map(a=>({amt:a[1]})));return r.map(([k,v])=>`<div><small>${E(k)} · ${F(v)}</small>${pb(pct(v,t))}</div>`).join('')||'<p class=mut>No spending yet.</p>'};
const billRow=o=>`<div class=row2><div><b>${E(o.b.name)}</b><small>${o.d} · ${o.b.freq}</small></div><span class="tag ${o.st}">${o.st}</span><b>${F(o.b.amt)}</b>${o.paid?'':`<button class=ic onclick="pay('${o.key}')">Pay</button>`}</div>`;
const txRow=x=>`<div class=row2><div><b>${E(x.name)}</b><small>${x.date} · ${E(x.cat)}${x.key?' · fixed bill':''}</small></div><b class=${x.type=='income'?'inc':'exp'}>${x.type=='income'?'+':'−'}${F(x.amt)}</b><button class=ic aria-label=Edit onclick="editTx('${x.id}')">✎</button><button class=ic aria-label=Delete onclick="delTx('${x.id}')">✕</button></div>`;
function dash(){const d=D(),m=d.m,s=S.set,tg=s.daily||d.safe,over=d.td>tg&&d.td>0,sv=SB(),up=d.bl.filter(x=>!x.paid);
const rows=[5,4,3,2,1,0].map(i=>{const y=addM(CM,-i),x=M(y);return[MN(y),x.inc,x.exp]});
return`<h2>Dashboard</h2><div class="card safe" style="margin-bottom:14px"><small>Safe daily spending limit</small><b class=hero>${F(d.safe)}</b><small>per day for ${d.left} day${d.left>1?'s':''} left, including today. A recommendation from your budget, not extra money.</small>
<div style="margin-top:10px">Today: spent ${F(d.td)} · ${over?'<b>over your limit by '+F(d.td-tg)+'</b>':'remaining '+F(Math.max(0,tg-d.td))}${s.daily?' (your target '+F(s.daily)+')':''}</div>${pb(pct(d.td,tg||1))}${d.avail<0?`<b>Budget deficit: ${F(-d.avail)}</b>`:''}</div>
<div class=grid>${card('Available balance',F(d.bal),'separate from savings')}${card('Income this month',F(m.inc),'salary '+F(m.sal),'inc')}${card('Expenses paid',F(m.exp),'','exp')}${card('Fixed expenses',F(d.fixed),'unpaid reserved '+F(d.res))}${card('Daily & variable',F(m.vx))}${card('Total savings',F(sv.bal))}${card('Remaining budget',F(d.avail),'budget '+F(s.budget)+' − fixed − variable')}${card('Savings target',Math.round(pct(Math.max(0,m.inc-m.exp),s.target))+'%',F(Math.max(0,m.inc-m.exp))+' of '+F(s.target))}</div>
<div class=bar><button class="btn p" onclick=expForm()>Record purchase</button><button class=btn onclick=incForm()>Add income</button><button class=btn onclick=confSal()>Confirm salary</button></div>
<div class=g2><div class=card><b>Income vs expenses</b>${bars(rows)}</div><div class=card><b>Upcoming & overdue bills</b>${up.map(billRow).join('')||'<p class=mut>Nothing due this month.</p>'}</div></div>
<h3>Recent transactions</h3><div class=card>${[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(txRow).join('')||'<p class=mut>No transactions yet. Add one or load demo data in Settings.</p>'}</div>`}
function tx(){const t=y=>M(y).exp,d=sum(S.tx.filter(x=>x.type=='expense'&&x.date==T)),yr=sum(S.tx.filter(x=>x.type=='expense'&&x.date.startsWith(T.slice(0,4))));
return`<h2>Transactions</h2><div class=grid>${card('Spent today',F(d))}${card('Spent this month',F(t(CM)))}${card('Spent this year',F(yr))}</div><div class=bar><button class="btn p" onclick=expForm()>Record purchase</button><button class=btn onclick=incForm()>Add income</button><button class=btn onclick=expCsv()>Export CSV</button></div>
<div class=bar><input id=fq placeholder=Search value="${E(Fq.q)}" oninput="Fq.q=this.value;lst()"><select onchange="Fq.type=this.value;lst()"><option value="">All types<option value=income ${Fq.type=='income'?'selected':''}>Income<option value=expense ${Fq.type=='expense'?'selected':''}>Expense</select><select onchange="Fq.cat=this.value;lst()"><option value="">All categories${[...new Set([...IC,...EC,...BC])].map(c=>`<option ${Fq.cat==c?'selected':''}>${c}`).join('')}</select><input type=date value="${Fq.from}" onchange="Fq.from=this.value;lst()" aria-label=From><input type=date value="${Fq.to}" onchange="Fq.to=this.value;lst()" aria-label=To></div><div class=card><small id=tot></small><div id=lst></div></div>`}
const fl=()=>S.tx.filter(x=>(!Fq.type||x.type==Fq.type)&&(!Fq.cat||x.cat==Fq.cat)&&(!Fq.q||x.name.toLowerCase().includes(Fq.q.toLowerCase()))&&(!Fq.from||x.date>=Fq.from)&&(!Fq.to||x.date<=Fq.to)).sort((a,b)=>b.date.localeCompare(a.date));
function lst(){const r=fl();$('#lst').innerHTML=r.map(txRow).join('')||'<p class=mut>No matching transactions.</p>';$('#tot').textContent=`${r.length} shown · income ${F(sum(r.filter(x=>x.type=='income')))} · expenses ${F(sum(r.filter(x=>x.type=='expense')))}`}
const expCsv=()=>showCsv([['Date','Type','Name','Category','Amount (INR)','Method','Notes'],...fl().map(x=>[x.date,x.type,x.name,x.cat,(x.amt/100).toFixed(2),x.method,x.notes])]);
function fx(){const bl=BM(CM),tot=bl.reduce((n,x)=>n+x.b.amt,0),paid=bl.filter(x=>x.paid).reduce((n,x)=>n+x.b.amt,0);
return`<h2>Fixed Expenses</h2><div class=grid>${card('Due this month',F(tot))}${card('Paid (actual)',F(paid),'','inc')}${card('Still to pay',F(tot-paid),'reserved, not deducted from balance','exp')}${card('Salary committed',S.set.salary?pct(tot,S.set.salary).toFixed(1)+'%':'n/a',S.set.salary?'of '+F(S.set.salary):'set salary in Settings')}</div><div class=bar><button class="btn p" onclick=billForm()>Add fixed expense</button></div>
<div class=card>${S.bills.map(b=>{const o=BM(CM).filter(x=>x.b.id==b.id);return`<div class=row2><div><b>${E(b.name)}</b><small>${E(b.cat)} · ${b.freq} · next/first due ${b.due}${b.paused?' · paused':''}</small>${o.map(x=>`<small>This month: ${x.d} <span class="tag ${x.st}">${x.st}</span> ${x.paid?'':`<a style="cursor:pointer;text-decoration:underline" onclick="pay('${x.key}')">Mark paid</a>`}</small>`).join('')}</div><b>${F(b.amt)}</b><button class=ic onclick="billForm('${b.id}')">✎</button><button class=ic onclick="togB('${b.id}')">${b.paused?'▶':'⏸'}</button><button class=ic onclick="delB('${b.id}')">✕</button></div>`}).join('')||'<p class=mut>No fixed expenses yet. Add rent, bills, EMIs and subscriptions.</p>'}</div>`}
function bud(){const d=D(),m=d.m,s=S.set,L=(n,a,b)=>`<div class=card><b>${n}</b> <small>Planned ${F(b)} · Actual ${F(a)}</small>${pb(pct(a,b))}${b&&a>=b?'<small class=exp>Over budget</small>':b&&a>=b*.8?'<small class=warn>80% reached</small>':''}</div>`;
return`<h2>Budgets</h2><div class=bar><button class="btn p" onclick=budForm()>Edit budgets</button><button class=btn onclick=limForm()>Category limit</button></div><div class=g2>${L('Total',m.exp+d.res,s.budget)}${L('Fixed',d.fixed,s.fb)}${L('Variable',m.vx,s.vb)}</div><h3>Category limits</h3><div class=g2>${Object.entries(S.lim).map(([c,l])=>L(E(c),sum(m.ex.filter(x=>x.cat==c)),l)).join('')||'<p class=mut>No category limits set.</p>'}</div>`}
function sav(){const b=SB(),mon=[...new Set(S.tx.map(x=>x.date.slice(0,7)))].sort().filter(y=>!S.closed[y]),al=sum(S.goals.map(g=>({amt:g.alloc})));let run=0;const pts=[...S.sav].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>run+=x.type=='withdraw'?-x.amt:x.amt),mx=Math.max(1,...pts),n=pts.length;
return`<h2>Savings</h2><div class=grid>${card('Current balance',F(b.bal))}${card('Starting savings',F(b.s))}${card('Contributions',F(b.c),'incl. month-end','inc')}${card('Withdrawals',F(b.w),'','exp')}</div><div class=bar><button class="btn p" onclick="savForm('deposit')">Deposit</button><button class=btn onclick="savForm('withdraw')">Withdraw</button><button class=btn onclick="savForm('initial')">Set initial savings</button><button class=btn onclick=adjForm()>Manual correction</button></div>
<div class=g2><div class=card><b>Growth</b>${n>1?`<svg viewBox="0 0 300 100" class=ch><polyline fill=none stroke="var(--ac)" stroke-width=2.5 points="${pts.map((v,i)=>(i/(n-1)*290+5)+','+(95-v/mx*85)).join(' ')}"/></svg>`:'<p class=mut>Add more entries to see growth.</p>'}</div>
<div class=card><b>Month-end</b>${mon.map(y=>`<div class=row2><div>${MN(y)} ${y.slice(0,4)}<small>${y==CM?'in progress':'ready to close'}</small></div><button onclick="closeM('${y}')">Review & close</button></div>`).join('')||'<p class=mut>All months closed.</p>'}<small>Closed: ${Object.keys(S.closed).length}</small></div></div>
<h3>Goals <button class=ic onclick=goalForm()>+ New</button></h3><small>Unallocated savings: ${F(b.bal-al)}</small><div class=g2>${S.goals.map(g=>`<div class=card><b>${E(g.name)}</b><small>${F(g.alloc)} of ${F(g.target)} · by ${g.date}</small>${pb(pct(g.alloc,g.target))}<small>${pct(g.alloc,g.target).toFixed(0)}%</small><button class=ic onclick="allocForm('${g.id}')">Allocate</button> <button class=ic onclick="ask('Delete goal?',()=>{S.goals=S.goals.filter(x=>x.id!='${g.id}');save()})">✕</button></div>`).join('')}</div>
<h3>Audit trail</h3><div class=card>${S.audit.slice(-8).reverse().map(a=>`<small>${a.d} · ${E(a.t)}</small>`).join('')||'<p class=mut>No entries yet.</p>'}</div>`}
function rep(){const y=RM,m=M(y),pv=M(addM(y,-1)),cl=S.closed[y],c=cl?cl.c:Math.max(0,m.inc-m.exp),pc=S.closed[addM(y,-1)]?S.closed[addM(y,-1)].c:Math.max(0,pv.inc-pv.exp),ch=(a,b)=>a>b?'increased by '+F(a-b):a<b?'decreased by '+F(b-a):'unchanged',top=catRows(m.ex)[0];
return`<h2>Monthly Report</h2><div class=bar><input type=month value="${y}" onchange="RM=this.value||CM;render()"><button class=btn onclick=repCsv()>Export CSV</button>${!cl&&y<CM?`<button class="btn p" onclick="closeM('${y}')">Close month</button>`:''}</div>
<div class=grid>${card('Salary received',F(m.sal))}${card('Other income',F(m.inc-m.sal))}${card('Total income',F(m.inc),'','inc')}${card('Fixed paid',F(m.fx))}${card('Variable expenses',F(m.vx))}${card('Total expenses',F(m.exp),'','exp')}${card(m.inc>=m.exp?'Surplus':'Deficit',F(Math.abs(m.inc-m.exp)))}${card('Savings contribution',F(c),cl?'recorded':'projected until closed')}${card('Savings balance',F(SB().bal),'overall, not this month')}${card('Savings rate',m.inc>0?(c/m.inc*100).toFixed(2)+'%':'Unavailable','income is zero')}${card('Vs previous month',(c>=pc?'+':'−')+F(Math.abs(c-pc)),'savings')}${card('Target progress',pct(Math.max(0,m.inc-m.exp),S.set.target).toFixed(0)+'%','target '+F(S.set.target))}</div>
<div class=g2><div class=card><b>Compared with ${MN(addM(y,-1))}</b><p>Income ${ch(m.inc,pv.inc)}.<br>Expenses ${ch(m.exp,pv.exp)}.<br>Savings contribution ${ch(c,pc)}.<br>Biggest category: ${top?E(top[0])+' ('+F(top[1])+')':'none'}.</p><small>Fixed ${F(m.fx)} vs variable ${F(m.vx)}</small>${pb(pct(m.fx,m.exp))}</div><div class=card><b>Spending by category</b>${catBars(m.ex)}</div></div>`}
const repCsv=()=>{const m=M(RM);showCsv([['Month',RM],['Income',m.inc/100],['Fixed expenses',m.fx/100],['Variable expenses',m.vx/100],['Total expenses',m.exp/100],['Surplus',(m.inc-m.exp)/100],[],['Date','Type','Name','Category','Amount'],...m.t.map(x=>[x.date,x.type,x.name,x.cat,x.amt/100])])};
function set(){const s=S.set;return`<h2>Settings</h2><div class=g2><div class=card><b>Salary & budget</b><small>${F(s.salary)} on day ${s.day} · budget ${F(s.budget)} · target ${F(s.target)}</small><div class=bar style="margin-top:10px"><button class="btn p" onclick=salForm()>Edit</button><button class=btn onclick=confSal()>Confirm this month’s salary</button></div><small>Changing salary never alters past records.</small></div>
<div class=card><b>Month-end bookkeeping</b><label><select onchange="S.set.auto=this.value=='1';save()"><option value=1 ${s.auto?'selected':''}>Automatic (past months)<option value=0 ${s.auto?'':'selected'}>Manual review only</select></label><small>Updates records only; no real transfers.</small></div>
<div class=card><b>Demo data</b><div class=bar style="margin-top:8px"><button class=btn onclick=demo()>Load demo</button><button class=btn onclick=rmDemo()>Remove demo</button></div></div>
<div class=card><b>Your data</b><small>Stored privately in this browser only.</small><div class=bar style="margin-top:8px"><button class=btn onclick="ask('Erase ALL data?',()=>{S=def();save();setTimeout(setup,50)})">Reset everything</button></div></div></div>`}
function demo(){if(S.tx.some(x=>x.demo))return info('Demo data is already loaded.');const a=o=>S.tx.push({id:uid(),demo:1,method:'',notes:'',...o});Object.assign(S.set,{salary:4000000,budget:2800000,fb:1400000,vb:1400000,target:1500000,done:true});
S.bills.push({id:'dB1',demo:1,name:'PG rent',amt:800000,cat:'PG rent',due:addM(CM,-2)+'-05',freq:'Monthly',rem:'3',paused:false},{id:'dB2',demo:1,name:'Mobile & internet',amt:59900,cat:'Mobile & internet',due:addM(CM,-2)+'-10',freq:'Monthly',rem:'3',paused:false},{id:'dB3',demo:1,name:'Streaming',amt:19900,cat:'Subscriptions',due:addM(CM,-2)+'-20',freq:'Monthly',rem:'3',paused:false});
[2,1,0].forEach(i=>{const y=addM(CM,-i);a({type:'income',name:'Salary',amt:4000000,date:y+'-01',cat:'Salary',sal:y});if(i)a({type:'income',name:'Freelance',amt:i*100000,date:y+'-15',cat:'Freelance'});
[['Groceries',320000,3],['Food',240000,9],['Transport',150000,12],['Shopping',i*90000+100000,14]].forEach(([c,v,d])=>a({type:'expense',name:c+' spend',amt:v,date:y+'-'+pad(d),cat:c}));
if(i){a({type:'expense',name:'PG rent',amt:800000,date:y+'-05',cat:'PG rent',key:'dB1@'+y+'-05'});a({type:'expense',name:'Mobile & internet',amt:59900,date:y+'-10',cat:'Mobile & internet',key:'dB2@'+y+'-10'})}});
S.sav.push({id:uid(),demo:1,type:'initial',amt:5000000,date:addM(CM,-3)+'-01',note:'Demo'});autoClose();save();render()}
function rmDemo(){S.tx=S.tx.filter(x=>!x.demo);S.bills=S.bills.filter(b=>!b.demo);S.sav=S.sav.filter(x=>!x.demo);const has=new Set(S.tx.map(x=>x.date.slice(0,7)));Object.keys(S.closed).forEach(y=>{if(!has.has(y))delete S.closed[y]});S.sav=S.sav.filter(x=>x.type!='month'||has.has(x.month));save();render()}
const NAV=[['dash','◧','Dashboard'],['tx','⇄','Transactions'],['fx','↻','Fixed'],['bud','◔','Budgets'],['sav','❖','Savings'],['rep','▤','Reports'],['set','⚙','Settings']],VW={dash,tx,fx,bud,sav,rep,set};
function go(v){V=v;render()}
function render(){$('#nv').innerHTML='<h1>Ledger</h1>'+NAV.map(n=>`<a tabindex=0 class="${V==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('');$('#mn').innerHTML=VW[V]();if(V=='tx')lst();scrollTo(0,0)}
autoClose();render();if(!S.set.done)setup();
</script></body></html>
